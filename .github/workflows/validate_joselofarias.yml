name: Validate JoseloFarias Fork

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-joselofarias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Assemble JoseloFarias Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Assemble unsigned debug APK
        run: ./gradlew :app:assembleJoselofariasDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Inure-JoseloFarias-Debug
          path: app/build/outputs/apk/joselofarias/debug/*.apk
          if-no-files-found: error
