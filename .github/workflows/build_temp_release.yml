name: Build Release APK (Temporary)

on:
    workflow_dispatch:
    pull_request:
        branches:
            - master

jobs:
    build:
        name: Build JoseloFarias Debug APK
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Java and Android SDK
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Accept Android SDK licenses
                run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

            -   name: Build JoseloFarias Debug APK
                run: |
                    set -Eeuo pipefail
                    chmod +x ./gradlew
                    ./gradlew clean assembleJoselofariasDebug --no-build-cache --rerun-tasks --stacktrace
                    find app/build/outputs/apk -type f -name '*.apk' -size +0c -print

            -   name: Archive APKs
                uses: actions/upload-artifact@v4
                with:
                    name: Inure-JoseloFarias-debug-${{ github.sha }}
                    path: app/build/outputs/apk/**/*.apk
                    if-no-files-found: error
                    retention-days: 14
